<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
    <h1>Checkout</h1>
    <section>
<h2>Your Cart</h2>
<img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="Rubic cube">
    </section>
    <section>
        <h2>Payment Information</h2>
        <form>
            <label for="card-name">Enter your card name:<span aria-hidden="true">*</span></label>
            <input id="card-name" name="card-name" type="text" required>
            <label for="card-number">Enter your card number<span aria-hidden="true">*</span></label></label>
            <input id="card-number" name="card-number" type="text" 
            aria-describedby="card-number-help"
            placeholder="1234123412341234"
            required>
            <p id="card-number-help">Please enter your 16-digit card number.</p>
        </form>
        </section>

</body>

</html>
