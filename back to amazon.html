<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
<style>
.link{
    color: rgb(0, 113, 133);
    transition: color 1s;
}
.link:hover{
    color: green;
}
.link:active{
    color:brown;
}
.paragraph1{
    font-size:x-large;
    font-weight: bolder;
}
.paragraph2{
    color:rgb(36, 128, 0);
    font-weight: bold;
}
.paragraph3{
    font-size: 18px;
}
.add-to-cart-button{
    background-color: rgb(255,216,20);
    border: none;
    height: 36px;
    width: 130px;
    border-radius: 14px;
    margin-right: 10px;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 1s;
    transition: box-shadow 1s;
}
.add-to-cart-button:hover{
    opacity: 0.75;
    box-shadow: 5px 5px 5px 10px rgba(0, 0, 0, 0.15);
}
.add-to-cart-button:active{
    background-color: blue;
}
.buy-now-button{
    background-color: rgb(255,164,28);
    border: none;
    height: 36px;
    width: 130px;
    border-radius: 14px;
    margin-right: 10px;
    font-weight: bold;
    cursor: pointer;
    transition: opacity 1s;
     transition: box-shadow 1s;
}
.buy-now-button:hover{
    opacity: 0.75;
    box-shadow: 5px 5px 5px 10px rgba(0, 0, 0, 0.15);
}
.buy-now-button:active{
    background-color: blue;
}
</style>
</head>
<body>
<a class="link" href="https://www.amazon.in/" target="_blank">Back to Amazon</a>
<p class="paragraph1">Nike Black Running Shoes</p>
<p class="paragraph2"> $39- in stock</p>
<p class="paragraph3">Free delivery tomorrow.</p>
<button class="add-to-cart-button">Add to Cart</button> 
<button class="buy-now-button">Buy Now</button>
</body>
</html>
