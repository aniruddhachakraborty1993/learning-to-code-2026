<!DOCTYPE html>
<html lang="en">
<style>
    .subscribe-button{
    background-color: red;
    color: white;
    border: none;
    height: 36px;
    width: 105px;
    border-radius: 2px;
    cursor: pointer; 
    margin-right: 2px; 
    transition: background-color 1s;  
}
.subscribe-button:hover{
    background-color: green;
}
.subscribe-button:active{
    background-color: blue;
}
    .join-button{
        width: 100px;
        height: 36px;
        background-color: white;
        color:black;
        border-color: rgb(41, 118, 211);
        border-style: solid;
        border-width: 1px;
        color: rgb(41, 118, 211);
        border-radius: 2px;
        cursor: pointer;
        margin-right: 2px;
        transition: opacity 1s;
    }
.join-button:hover{
    background-color: rgb(41, 118, 211);
    color: white;
}
.join-button:active{
    opacity: 0.3;
}
    .tweet-button{
       background-color: rgb(2,13,255);
        color:white;
         height: 36px;
         width: 70px;
        border-radius: 18px;
        cursor: pointer;
        font-weight: bold;
        transition: box-shadow 1s; 
    }
    .tweet-button:hover{
         box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);

    }
</style>
<button class="subscribe-button">SUBSCRIBE</button>
<button class="join-button">JOIN</button>
<button class="tweet-button">TWEET</button>
</html>
